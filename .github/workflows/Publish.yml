name: Project Publishing
permissions:
  contents: read
on:
  push:
    paths: [ 'cat2/**','**/Publish.yml' ]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@main
        with:
          path: ~/.nuget/packages
          key: nuget-cache
      - run: dotnet publish -r win-x64 -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:InvariantGlobalization=true -p:EnableWindowsTargeting=true
      - uses: actions/upload-artifact@main
        with:
          name: Release
          path: |
             **/publish
             !**/*.pdb
